	var b64 = function (s) { var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; };
	function ouvrir(brute) {
		return crypto.subtle.importKey("raw", octets(brute), "AES-GCM", false, ["decrypt"])
			.then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: octets(IV) }, k, b64(DONNEES)); })
			.then(function (html) { document.open(); document.write(new TextDecoder().decode(html)); document.close(); });
	}
	function oublier() { try { localStorage.removeItem(NOM); } catch (e) {} document.documentElement.className = ""; }
	// Clé déjà mémorisée : ouverture directe, une fois la page d'accès entièrement lue
	// (sinon document.open() serait ignoré et les deux pages se mélangeraient).
	function auto() {
		try {
			var memo = JSON.parse(localStorage.getItem(NOM) || "null");
			if (memo && memo.fin > Date.now()) { ouvrir(memo.cle).catch(oublier); } else { oublier(); }
		} catch (e) { oublier(); }
	}
	if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", function () { setTimeout(auto, 0); }); } else { setTimeout(auto, 0); }
	document.getElementById("acces").addEventListener("submit", function (ev) {
		ev.preventDefault();
		var mdp = document.getElementById("mdp").value.trim();
		crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveBits"])
			.then(function (base) { return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: octets(SEL), iterations: ITER }, base, 256); })
			.then(function (bits) {
				var brute = hex(bits);
				return ouvrir(brute).then(function () {
					try { localStorage.setItem(NOM, JSON.stringify({ cle: brute, fin: Date.now() + DUREE })); } catch (e) {}
				});
			})
			.catch(function () { document.getElementById("erreur").hidden = false; });
	});
})();
</script>
